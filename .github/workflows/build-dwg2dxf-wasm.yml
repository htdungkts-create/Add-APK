name: Build DWG2DXF WASM Engine

on:
  push:
    branches: [ cad-dxf-gate-v03 ]
    paths:
      - '.github/workflows/build-dwg2dxf-wasm.yml'
      - 'cad_converter/**'

permissions:
  contents: read

jobs:
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install native build prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool libtool-bin pkg-config gettext texinfo perl make git ca-certificates

      - name: Install pinned Emscripten SDK
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch 3.1.74 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          cd /tmp/emsdk
          ./emsdk install 3.1.74
          ./emsdk activate 3.1.74
          source ./emsdk_env.sh
          emcc --version | head -n 2
          echo "EMSDK=/tmp/emsdk" >> "$GITHUB_ENV"

      - name: Build reusable LibreDWG dwg2dxf module
        shell: bash
        env:
          LIBREDWG_REF: f860b0fb76d5f8effb5a70769a3389cb1e0308c8
        run: |
          set -euxo pipefail
          source "$EMSDK/emsdk_env.sh"
          git clone https://github.com/LibreDWG/libredwg.git /tmp/libredwg
          cd /tmp/libredwg
          git checkout --detach "$LIBREDWG_REF"
          git submodule update --init --recursive
          ./autogen.sh
          export LDFLAGS='-sMODULARIZE=1 -sEXPORT_NAME=createDwg2Dxf -sEXPORTED_RUNTIME_METHODS=FS,callMain -sALLOW_MEMORY_GROWTH=1 -sEXIT_RUNTIME=0 -sENVIRONMENT=web,node'
          emconfigure ./configure \
            --enable-release \
            --disable-shared \
            --enable-static \
            --disable-bindings \
            --disable-docs \
            --disable-werror
          emmake make -C src -j2
          emmake make -C programs dwg2dxf -j2
          echo '--- built files ---'
          ls -lah programs/dwg2dxf*
          file programs/dwg2dxf* || true

      - name: Smoke test reusable WASM module
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/libredwg
          if [ -f programs/dwg2dxf.js ]; then
            ENTRY=programs/dwg2dxf.js
          elif [ -f programs/dwg2dxf ]; then
            cp programs/dwg2dxf programs/dwg2dxf.js
            ENTRY=programs/dwg2dxf.js
          else
            echo 'dwg2dxf JS launcher not found'
            exit 21
          fi
          node <<'JS'
          const createDwg2Dxf = require('/tmp/libredwg/programs/dwg2dxf.js');
          (async () => {
            const mod = await createDwg2Dxf({noInitialRun:true});
            if (!mod.FS || typeof mod.FS.writeFile !== 'function') throw new Error('FS export missing');
            if (typeof mod.callMain !== 'function') throw new Error('callMain export missing');
            console.log('CCL_WASM_MODULE_SMOKE_PASS');
          })().catch(e => { console.error(e); process.exit(1); });
          JS
          echo "$ENTRY" > /tmp/dwg2dxf_entry.txt

      - name: Package immutable engine
        shell: bash
        env:
          LIBREDWG_REF: f860b0fb76d5f8effb5a70769a3389cb1e0308c8
        run: |
          set -euxo pipefail
          source "$EMSDK/emsdk_env.sh"
          OUT="$GITHUB_WORKSPACE/CCL_DWG2DXF_WASM_v0.2"
          mkdir -p "$OUT"
          cd /tmp/libredwg
          ENTRY=$(cat /tmp/dwg2dxf_entry.txt)
          cp "$ENTRY" "$OUT/dwg2dxf.js"
          for f in programs/dwg2dxf.wasm programs/dwg2dxf.data; do
            [ -f "$f" ] && cp "$f" "$OUT/"
          done
          test -s "$OUT/dwg2dxf.js"
          if grep -q '\.wasm' "$OUT/dwg2dxf.js"; then test -s "$OUT/dwg2dxf.wasm"; fi
          emcc --version > "$OUT/EMSCRIPTEN_VERSION.txt"
          printf '%s\n' "$LIBREDWG_REF" > "$OUT/LIBREDWG_REF.txt"
          cat > "$OUT/README.txt" <<'EOF'
          CCL_DWG2DXF_WASM_v0.2
          Reusable offline DWG -> DXF writer candidate using Emscripten MEMFS.
          Host supplies DWG bytes to Module.FS, calls Module.callMain, then reads DXF bytes from Module.FS.
          No server/Railway/native host filesystem is required.
          Boundary: conversion artifact only; conversion PASS does not prove semantic geometry/GFA.
          Source DWG must remain read-only; output goes to a separate result area.
          EOF
          sha256sum "$OUT"/* | tee "$OUT/SHA256SUMS.txt"
          ls -lah "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: CCL-DWG2DXF-WASM-v0.2
          path: CCL_DWG2DXF_WASM_v0.2
          retention-days: 30
          if-no-files-found: error
