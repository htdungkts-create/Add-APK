name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          "$SDKMANAGER" --list_installed | sed -n '1,120p'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Vendor LibreDWG WebAssembly
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/cclnpm app/src/main/assets/vendor/libredwg
          cd /tmp/cclnpm
          npm pack @mlightcad/libredwg-web@0.7.16
          tar -xzf mlightcad-libredwg-web-0.7.16.tgz
          cd "$GITHUB_WORKSPACE"
          mkdir -p app/src/main/assets/vendor/libredwg/dist app/src/main/assets/vendor/libredwg/wasm
          cp /tmp/cclnpm/package/dist/libredwg-web.js app/src/main/assets/vendor/libredwg/dist/
          cp /tmp/cclnpm/package/wasm/libredwg-web.js app/src/main/assets/vendor/libredwg/wasm/
          cp /tmp/cclnpm/package/wasm/libredwg-web.wasm app/src/main/assets/vendor/libredwg/wasm/
          test -s app/src/main/assets/vendor/libredwg/wasm/libredwg-web.wasm
          sha256sum app/src/main/assets/vendor/libredwg/wasm/* app/src/main/assets/vendor/libredwg/dist/*
      - name: Apply v0.3 LWPOLYLINE closed-flag patch
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/assets/index.html')
          s = p.read_text(encoding='utf-8')
          old = "function closed(o,pts){for(const k of ['closed','isClosed','is_closed']){if(o?.[k]===true||o?.[k]===1)return true}for(const k of ['flag','flags']){if(Number.isFinite(+o?.[k])&&((+o[k])&1))return true}if(pts?.length>2){const a=pts[0],b=pts[pts.length-1];if(Math.hypot(a.x-b.x,a.y-b.y)<1e-7)return true}return false}"
          new = "function closed(o,pts){for(const k of ['closed','isClosed','is_closed']){if(o?.[k]===true||o?.[k]===1)return true}const typ=String(o?.type??o?.dxfName??'').toUpperCase();for(const k of ['flag','flags']){if(Number.isFinite(+o?.[k])){const f=+o[k];if(typ==='LWPOLYLINE'){if((f&512)!==0)return true}else if((f&1)!==0)return true}}if(pts?.length>2){const a=pts[0],b=pts[pts.length-1];if(Math.hypot(a.x-b.x,a.y-b.y)<1e-7)return true}return false}"
          if old not in s:
              raise SystemExit('closed() patch anchor not found')
          s = s.replace(old, new, 1)
          s = s.replace('APK v0.2', 'APK v0.3', 1)
          s = s.replace("appVersion:'apk-0.2'", "appVersion:'apk-0.3'")
          p.write_text(s, encoding='utf-8')
          print('v0.3 patch applied')
          PY
          grep -F "APK v0.3" app/src/main/assets/index.html
          grep -F "f&512" app/src/main/assets/index.html
      - name: Restore stable CCL dev signing key
        shell: bash
        run: |
          set -euxo pipefail
          base64 -d app/ccl-pocket-dev.jks.b64 > app/ccl-pocket-dev.jks
          keytool -list -keystore app/ccl-pocket-dev.jks -storepass cclpocket2026 -alias cclpocket
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          set -euxo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CCL-CAD-POCKET-APK-v0.3
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
