name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          "$SDKMANAGER" --list_installed | sed -n '1,120p'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Vendor LibreDWG WebAssembly
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/cclnpm app/src/main/assets/vendor/libredwg
          cd /tmp/cclnpm
          npm pack @mlightcad/libredwg-web@0.7.16
          tar -xzf mlightcad-libredwg-web-0.7.16.tgz
          cd "$GITHUB_WORKSPACE"
          mkdir -p app/src/main/assets/vendor/libredwg/dist app/src/main/assets/vendor/libredwg/wasm
          cp /tmp/cclnpm/package/dist/libredwg-web.js app/src/main/assets/vendor/libredwg/dist/
          cp /tmp/cclnpm/package/wasm/libredwg-web.js app/src/main/assets/vendor/libredwg/wasm/
          cp /tmp/cclnpm/package/wasm/libredwg-web.wasm app/src/main/assets/vendor/libredwg/wasm/
          test -s app/src/main/assets/vendor/libredwg/wasm/libredwg-web.wasm
          sha256sum app/src/main/assets/vendor/libredwg/wasm/* app/src/main/assets/vendor/libredwg/dist/*
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CCL-CAD-POCKET-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
