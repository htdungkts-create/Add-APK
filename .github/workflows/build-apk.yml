name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Vendor LibreDWG WebAssembly
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/cclnpm app/src/main/assets/vendor/libredwg
          cd /tmp/cclnpm
          npm pack @mlightcad/libredwg-web@0.7.16
          tar -xzf mlightcad-libredwg-web-0.7.16.tgz
          cd "$GITHUB_WORKSPACE"
          mkdir -p app/src/main/assets/vendor/libredwg/dist app/src/main/assets/vendor/libredwg/wasm
          cp /tmp/cclnpm/package/dist/libredwg-web.js app/src/main/assets/vendor/libredwg/dist/
          cp /tmp/cclnpm/package/wasm/libredwg-web.js app/src/main/assets/vendor/libredwg/wasm/
          cp /tmp/cclnpm/package/wasm/libredwg-web.wasm app/src/main/assets/vendor/libredwg/wasm/
          test -s app/src/main/assets/vendor/libredwg/wasm/libredwg-web.wasm

      - name: Apply v0.5 BLOCK INSERT patch
        shell: bash
        run: |
          set -euxo pipefail
          python tools/patch_v05.py
          grep -F "TARGETED_DB_ENTITIES+BLOCK_INSERT" app/src/main/assets/index.html
          grep -F "version:'0.5.0'" app/src/main/assets/index.html
          grep -F "BLOCK_BASEPOINT→SCALE_XY→ROTATE→TRANSLATE" app/src/main/assets/index.html

      - name: Check app JavaScript syntax
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          if not m: raise SystemExit('module script not found')
          Path('/tmp/ccl-app.mjs').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/ccl-app.mjs

      - name: Nested transform smoke test
        shell: bash
        run: |
          set -euxo pipefail
          node <<'JS'
          function mm(A,B){return{a:A.a*B.a+A.c*B.b,b:A.b*B.a+A.d*B.b,c:A.a*B.c+A.c*B.d,d:A.b*B.c+A.d*B.d,tx:A.a*B.tx+A.c*B.ty+A.tx,ty:A.b*B.tx+A.d*B.ty+A.ty}}
          function p(M,q){return{x:M.a*q.x+M.c*q.y+M.tx,y:M.b*q.x+M.d*q.y+M.ty}}
          function ins(ip,sx,sy,r,bp){const c=Math.cos(r),s=Math.sin(r),a=c*sx,b=s*sx,cc=-s*sy,d=c*sy,ox=-bp.x,oy=-bp.y;return{a,b,c:cc,d,tx:ip.x+a*ox+cc*oy,ty:ip.y+b*ox+d*oy}}
          const M=mm({a:1,b:0,c:0,d:1,tx:0,ty:0},ins({x:100,y:50},2,2,Math.PI/2,{x:10,y:5}));
          const q=p(M,{x:10,y:5});
          if(Math.abs(q.x-100)>1e-9||Math.abs(q.y-50)>1e-9)process.exit(1);
          const det=Math.abs(M.a*M.d-M.b*M.c);if(Math.abs(det-4)>1e-9)process.exit(2);
          console.log('nested transform smoke PASS');
          JS

      - name: Restore stable CCL dev signing key
        shell: bash
        run: |
          set -euxo pipefail
          base64 -d app/ccl-pocket-dev.jks.b64 > app/ccl-pocket-dev.jks
          test -s app/ccl-pocket-dev.jks

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify and name APK
        run: |
          set -euxo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk CCL_CAD_v0.5.apk
          sha256sum CCL_CAD_v0.5.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CCL-CAD-v0.5
          path: CCL_CAD_v0.5.apk
          retention-days: 30
