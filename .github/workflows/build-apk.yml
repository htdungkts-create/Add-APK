name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Vendor LibreDWG WebAssembly
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/cclnpm app/src/main/assets/vendor/libredwg
          cd /tmp/cclnpm
          npm pack @mlightcad/libredwg-web@0.7.16
          tar -xzf mlightcad-libredwg-web-0.7.16.tgz
          cd "$GITHUB_WORKSPACE"
          mkdir -p app/src/main/assets/vendor/libredwg/dist app/src/main/assets/vendor/libredwg/wasm
          cp /tmp/cclnpm/package/dist/libredwg-web.js app/src/main/assets/vendor/libredwg/dist/
          cp /tmp/cclnpm/package/wasm/libredwg-web.js app/src/main/assets/vendor/libredwg/wasm/
          cp /tmp/cclnpm/package/wasm/libredwg-web.wasm app/src/main/assets/vendor/libredwg/wasm/
          test -s app/src/main/assets/vendor/libredwg/wasm/libredwg-web.wasm

      - name: Apply v0.6 candidate intelligence patch
        shell: bash
        run: |
          set -euxo pipefail
          python tools/patch_v06.py
          grep -F "CANDIDATE GROUPS" app/src/main/assets/index.html
          grep -F "GRAPHIC-LIKE" app/src/main/assets/index.html
          grep -F "version:'0.6.0'" app/src/main/assets/index.html

      - name: Check app JavaScript syntax
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          if not m: raise SystemExit('module script not found')
          Path('/tmp/ccl-app.mjs').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/ccl-app.mjs

      - name: Candidate grouping smoke test
        shell: bash
        run: |
          set -euxo pipefail
          node <<'JS'
          function norm(x){return String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
          function hint(layer){const x=norm(layer);if(['void','shaft','thong tang','opening','hole'].some(k=>x.includes(k)))return'POSSIBLE';if(['net thay manh','text','dim','grid','truc'].some(k=>x.includes(k)))return'GRAPHIC-LIKE';return'UNKNOWN'}
          if(hint('SA_Net thay manh')!=='GRAPHIC-LIKE')process.exit(1);
          if(hint('KT_VOID_SHAFT')!=='POSSIBLE')process.exit(2);
          const rows=[{h:'1601C',layer:'SA_Net thay manh',a:3.8499,insert:'A'},{h:'1601C',layer:'SA_Net thay manh',a:3.8499,insert:'B'}];
          const key=r=>[r.h,r.layer,Math.round(r.a*10000)/10000].join('|');
          if(new Set(rows.map(key)).size!==1)process.exit(3);
          console.log('candidate grouping smoke PASS');
          JS

      - name: Restore stable CCL dev signing key
        shell: bash
        run: |
          set -euxo pipefail
          base64 -d app/ccl-pocket-dev.jks.b64 > app/ccl-pocket-dev.jks
          test -s app/ccl-pocket-dev.jks

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify and name APK
        run: |
          set -euxo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk CCL_CAD_v0.6.apk
          sha256sum CCL_CAD_v0.6.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CCL-CAD-v0.6
          path: CCL_CAD_v0.6.apk
          retention-days: 30
