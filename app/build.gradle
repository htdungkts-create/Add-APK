plugins { id 'com.android.application' }

android {
    namespace 'com.chucale.cadpocket'
    compileSdk 35

    defaultConfig {
        applicationId 'com.chucale.cadpocket'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.4.0'
    }

    signingConfigs {
        cclDev {
            storeFile file('ccl-pocket-dev.jks')
            storePassword 'cclpocket2026'
            keyAlias 'cclpocket'
            keyPassword 'cclpocket2026'
        }
    }

    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.cclDev
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.cclDev
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
