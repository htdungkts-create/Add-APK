plugins { id 'com.android.application' }

android {
    namespace 'com.chucale.cadpocket'
    compileSdk 35

    defaultConfig {
        applicationId 'com.chucale.cadpocket'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
